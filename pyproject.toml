[project]
name = "cerenity-rag"
version = "0.1.0"
description = "RAG-powered chatbot demo: LangGraph + Gemini 2.5 + Qdrant + SQLite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.1",
    "langchain-google-genai>=2.0.7",
    "qdrant-client>=1.12",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
